spring.application.name=robsen


spring.datasource.url=jdbc:postgresql://localhost:5432/robsenDb
spring.datasource.username=postgres
spring.datasource.password=robsenpwd
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:thisistestsecretkeyforrobsenapplication}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:360000000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:3000}

app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${BOOTSTRAP_ADMIN_FULL_NAME:Robsen Administrator}